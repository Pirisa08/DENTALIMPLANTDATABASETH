<!DOCTYPE html>
<html>
<head>
    <title>Clear Cache</title>
</head>
<body>
    <h1>Clearing localStorage...</h1>
    <script>
        localStorage.removeItem('admin_blogs_v1');
        localStorage.removeItem('admin_blogs');
        sessionStorage.clear();
        alert('localStorage cleared! The page will reload with fresh mock data.');
        window.location.href = 'http://localhost:3000/admin/blog';
    </script>
</body>
</html>
